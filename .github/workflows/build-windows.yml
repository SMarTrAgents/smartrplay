name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyQt5 pyinstaller
      - run: pyinstaller build/windows/smartrplay.spec --clean --distpath dist --workpath build
      - uses: actions/upload-artifact@v4
        with:
          name: SMarTrPlay-Windows
          path: dist/SMarTrPlay/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SMarTrPlay/SMarTrPlay.exe
